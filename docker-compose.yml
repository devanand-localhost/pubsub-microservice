version: '3'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pubsub-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - pubsub-network

  receiver-service:
    build: ./receiver-service
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/pubsub
      - REDIS_URL=redis://redis:6379
      - API_KEY=SECRET_API_KEY
      - PORT=3000
    depends_on:
      - mongodb
      - redis
    networks:
      - pubsub-network

  listener-service:
    build: ./listener-service
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/pubsub
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
      - receiver-service
    networks:
      - pubsub-network

networks:
  pubsub-network:
    driver: bridge

volumes:
  mongodb_data: