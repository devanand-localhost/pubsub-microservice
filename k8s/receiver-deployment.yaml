apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: receiver-service
  template:
    metadata:
      labels:
        app: receiver-service
    spec:
      containers:
        - name: receiver-service
          image: receiver-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/pubsub
            - name: REDIS_URL
              value: redis://redis:6379
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-key-secret
                  key: api-key
---
apiVersion: v1
kind: Service
metadata:
  name: receiver-service
spec:
  selector:
    app: receiver-service
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: api-key-secret
type: Opaque
data:
  api-key: eW91ci1zZWNyZXQtYXBpLWtleQ== # base64 encoded "SECRET_API_KEY"
